<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-lg mb-4">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center text-indigo-600 hover:text-indigo-800">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Accounting</h1>
            <button id="addExpenseBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                + Add Expense
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4">
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Total Revenue</p>
                        <p id="totalRevenue" class="text-2xl font-bold text-green-600 mt-2">₱0.00</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Total Expenses</p>
                        <p id="totalExpenses" class="text-2xl font-bold text-red-600 mt-2">₱0.00</p>
                    </div>
                    <div class="bg-red-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Net Profit</p>
                        <p id="netProfit" class="text-2xl font-bold text-indigo-600 mt-2">₱0.00</p>
                    </div>
                    <div class="bg-indigo-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Profit Margin</p>
                        <p id="profitMargin" class="text-2xl font-bold text-purple-600 mt-2">0%</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="date" id="startDate" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <input type="date" id="endDate" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="filterBtn" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                    Apply Filter
                </button>
                <button id="exportBtn" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    Export Report
                </button>
            </div>
        </div>

        <!-- Expenses Table -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Expense Records</h2>
                <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">All Categories</option>
                    <option value="inventory">Inventory</option>
                    <option value="utilities">Utilities</option>
                    <option value="salaries">Salaries</option>
                    <option value="rent">Rent</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="marketing">Marketing</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Date</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Category</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Description</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Amount</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Added By</th>
                            <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTable" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Expense Modal -->
    <div id="expenseModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-4">Add Expense</h2>
            
            <form id="expenseForm" class="space-y-4">
                <input type="hidden" id="expenseId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                    <input type="date" id="expenseDate" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="expenseCategory" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Select Category</option>
                        <option value="inventory">Inventory</option>
                        <option value="utilities">Utilities</option>
                        <option value="salaries">Salaries</option>
                        <option value="rent">Rent</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="marketing">Marketing</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₱)</label>
                    <input type="number" id="expenseAmount" required min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="expenseDescription" required rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700 transition">
                        Save Expense
                    </button>
                    <button type="button" id="cancelModalBtn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBR_PXkHxujRckgNXap4MqdH8MY98OQ_RI",
  authDomain: "pos-2-f566c.firebaseapp.com",
  projectId: "pos-2-f566c",
  storageBucket: "pos-2-f566c.firebasestorage.app",
  messagingSenderId: "1044464998936",
  appId: "1:1044464998936:web:ba368da8dc0d78ced8c16d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let expenses = [];
        let currentExpenseId = null;

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadData();
        });

        // Initialize dates
        const today = new Date();
        const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('startDate').valueAsDate = firstDayOfMonth;
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('expenseDate').valueAsDate = today;

        async function loadData() {
            await Promise.all([loadExpenses(), loadRevenue()]);
            calculateSummary();
        }

        async function loadExpenses() {
            try {
                const startDate = new Date(document.getElementById('startDate').value);
                const endDate = new Date(document.getElementById('endDate').value);
                endDate.setHours(23, 59, 59, 999);

                const snapshot = await db.collection('expenses')
                    .where('date', '>=', startDate)
                    .where('date', '<=', endDate)
                    .orderBy('date', 'desc')
                    .get();

                expenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                displayExpenses();
            } catch (error) {
                console.error('Error loading expenses:', error);
            }
        }

        async function loadRevenue() {
            try {
                const startDate = new Date(document.getElementById('startDate').value);
                const endDate = new Date(document.getElementById('endDate').value);
                endDate.setHours(23, 59, 59, 999);

                const snapshot = await db.collection('sales')
                    .where('date', '>=', startDate)
                    .where('date', '<=', endDate)
                    .get();

                const revenue = snapshot.docs.reduce((sum, doc) => sum + (doc.data().total || 0), 0);
                document.getElementById('totalRevenue').textContent = `₱${revenue.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading revenue:', error);
            }
        }

        function displayExpenses() {
            const table = document.getElementById('expensesTable');
            const categoryFilter = document.getElementById('categoryFilter').value;

            const filtered = categoryFilter === 'all' 
                ? expenses 
                : expenses.filter(e => e.category === categoryFilter);

            table.innerHTML = filtered.map(expense => {
                const date = expense.date?.toDate ? expense.date.toDate() : new Date(expense.date);
                
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm text-gray-700">${date.toLocaleDateString()}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800 capitalize">
                                ${expense.category}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-700">${expense.description}</td>
                        <td class="px-4 py-3 text-sm font-bold text-red-600">₱${expense.amount.toFixed(2)}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">${expense.addedBy || 'N/A'}</td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="editExpense('${expense.id}')" class="text-indigo-600 hover:text-indigo-800 mr-3 text-sm font-medium">
                                Edit
                            </button>
                            <button onclick="deleteExpense('${expense.id}')" class="text-red-600 hover:text-red-800 text-sm font-medium">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function calculateSummary() {
            const revenue = parseFloat(document.getElementById('totalRevenue').textContent.replace('₱', '')) || 0;
            const totalExp = expenses.reduce((sum, e) => sum + e.amount, 0);
            const netProfit = revenue - totalExp;
            const margin = revenue > 0 ? (netProfit / revenue * 100) : 0;

            document.getElementById('totalExpenses').textContent = `₱${totalExp.toFixed(2)}`;
            document.getElementById('netProfit').textContent = `₱${netProfit.toFixed(2)}`;
            document.getElementById('profitMargin').textContent = `${margin.toFixed(1)}%`;
        }

        function openExpenseModal(expenseId = null) {
            currentExpenseId = expenseId;
            const modal = document.getElementById('expenseModal');
            
            if (expenseId) {
                const expense = expenses.find(e => e.id === expenseId);
                const date = expense.date?.toDate ? expense.date.toDate() : new Date(expense.date);
                
                document.getElementById('modalTitle').textContent = 'Edit Expense';
                document.getElementById('expenseId').value = expenseId;
                document.getElementById('expenseDate').valueAsDate = date;
                document.getElementById('expenseCategory').value = expense.category;
                document.getElementById('expenseAmount').value = expense.amount;
                document.getElementById('expenseDescription').value = expense.description;
            } else {
                document.getElementById('modalTitle').textContent = 'Add Expense';
                document.getElementById('expenseForm').reset();
                document.getElementById('expenseDate').valueAsDate = new Date();
            }
            
            modal.classList.remove('hidden');
        }

        async function editExpense(expenseId) {
            openExpenseModal(expenseId);
        }

        async function deleteExpense(expenseId) {
            if (!confirm('Are you sure you want to delete this expense?')) return;
            
            try {
                await db.collection('expenses').doc(expenseId).delete();
                alert('Expense deleted successfully');
                await loadData();
            } catch (error) {
                console.error('Error deleting expense:', error);
                alert('Error deleting expense');
            }
        }

        function exportReport() {
            const revenue = parseFloat(document.getElementById('totalRevenue').textContent.replace('₱', '')) || 0;
            const totalExp = parseFloat(document.getElementById('totalExpenses').textContent.replace('₱', '')) || 0;
            const netProfit = parseFloat(document.getElementById('netProfit').textContent.replace('₱', '')) || 0;
            
            let csv = 'Accounting Report\n\n';
            csv += `Period: ${document.getElementById('startDate').value} to ${document.getElementById('endDate').value}\n\n`;
            csv += 'Summary\n';
            csv += `Total Revenue,₱${revenue.toFixed(2)}\n`;
            csv += `Total Expenses,₱${totalExp.toFixed(2)}\n`;
            csv += `Net Profit,₱${netProfit.toFixed(2)}\n\n`;
            csv += 'Expense Details\n';
            csv += 'Date,Category,Description,Amount\n';
            
            expenses.forEach(exp => {
                const date = exp.date?.toDate ? exp.date.toDate() : new Date(exp.date);
                csv += `${date.toLocaleDateString()},${exp.category},${exp.description},₱${exp.amount.toFixed(2)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `accounting_report_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Event Listeners
        document.getElementById('addExpenseBtn').addEventListener('click', () => openExpenseModal());
        document.getElementById('filterBtn').addEventListener('click', loadData);
        document.getElementById('exportBtn').addEventListener('click', exportReport);
        document.getElementById('categoryFilter').addEventListener('change', displayExpenses);

        document.getElementById('cancelModalBtn').addEventListener('click', () => {
            document.getElementById('expenseModal').classList.add('hidden');
        });

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const expenseData = {
                date: new Date(document.getElementById('expenseDate').value),
                category: document.getElementById('expenseCategory').value,
                amount: parseFloat(document.getElementById('expenseAmount').value),
                description: document.getElementById('expenseDescription').value,
                addedBy: auth.currentUser.email,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (currentExpenseId) {
                    await db.collection('expenses').doc(currentExpenseId).update(expenseData);
                    alert('Expense updated successfully');
                } else {
                    expenseData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('expenses').add(expenseData);
                    alert('Expense added successfully');
                }
                
                document.getElementById('expenseModal').classList.add('hidden');
                await loadData();
            } catch (error) {
                console.error('Error saving expense:', error);
                alert('Error saving expense');
            }
        });
    </script>
</body>
</html>
