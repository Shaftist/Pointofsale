<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg mb-4">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center text-indigo-600 hover:text-indigo-800">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Point of Sale</h1>
            <span id="cashierName" class="text-gray-700 font-medium"></span>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Products Section -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-md p-6">
                    <div class="mb-4">
                        <input type="text" id="searchInput" placeholder="Search products..." 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    
                    <!-- Category Filter -->
                    <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
                        <button class="category-btn px-4 py-2 bg-indigo-600 text-white rounded-lg whitespace-nowrap" data-category="all">All</button>
                        <button class="category-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 whitespace-nowrap" data-category="food">Food</button>
                        <button class="category-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 whitespace-nowrap" data-category="drinks">Drinks</button>
                        <button class="category-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 whitespace-nowrap" data-category="desserts">Desserts</button>
                    </div>

                    <!-- Products Grid -->
                    <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-h-[600px] overflow-y-auto"></div>
                </div>
            </div>

            <!-- Cart Section -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-md p-6 sticky top-4">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Current Order</h2>
                    
                    <div id="cartItems" class="space-y-3 max-h-64 overflow-y-auto mb-4"></div>
                    
                    <div class="border-t pt-4 space-y-3">
                        <div class="flex justify-between text-gray-700">
                            <span>Subtotal:</span>
                            <span id="subtotal">₱0.00</span>
                        </div>
                        
                        <!-- Discount Section -->
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-sm font-medium text-gray-700">Discount</label>
                                <button id="applyDiscountBtn" class="text-indigo-600 text-sm hover:underline">Apply</button>
                            </div>
                            <div class="flex gap-2">
                                <input type="number" id="discountInput" placeholder="%" min="0" max="100" 
                                    class="w-20 px-3 py-2 border rounded-lg text-center">
                                <input type="number" id="discountAmountInput" placeholder="₱" min="0" 
                                    class="flex-1 px-3 py-2 border rounded-lg">
                            </div>
                            <div class="flex justify-between text-sm text-red-600 mt-2">
                                <span>Discount:</span>
                                <span id="discountAmount">-₱0.00</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between text-lg font-bold text-gray-900">
                            <span>Total:</span>
                            <span id="total">₱0.00</span>
                        </div>
                        
                        <div class="space-y-2">
                            <button id="paymentBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                Proceed to Payment
                            </button>
                            <button id="clearCartBtn" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">
                                Clear Cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Payment</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Total Amount</label>
                <div id="modalTotal" class="text-3xl font-bold text-indigo-600">₱0.00</div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Cash Received</label>
                <input type="number" id="cashReceived" placeholder="0.00" min="0" step="0.01"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Change</label>
                <div id="change" class="text-2xl font-bold text-green-600">₱0.00</div>
            </div>
            
            <div class="flex gap-3">
                <button id="completePaymentBtn" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                    Complete Sale
                </button>
                <button id="cancelPaymentBtn" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBR_PXkHxujRckgNXap4MqdH8MY98OQ_RI",
  authDomain: "pos-2-f566c.firebaseapp.com",
  projectId: "pos-2-f566c",
  storageBucket: "pos-2-f566c.firebasestorage.app",
  messagingSenderId: "1044464998936",
  appId: "1:1044464998936:web:ba368da8dc0d78ced8c16d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let cart = [];
        let products = [];
        let currentCategory = 'all';
        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo'));
            if (userInfo) {
                document.getElementById('cashierName').textContent = userInfo.displayName;
            }
            await loadProducts();
        });

        async function loadProducts() {
            try {
                const snapshot = await db.collection('products').where('quantity', '>', 0).get();
                products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayProducts() {
            const grid = document.getElementById('productsGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            grid.innerHTML = filtered.map(product => `
                <div class="bg-gray-50 rounded-lg p-4 cursor-pointer hover:bg-gray-100 transition border border-gray-200" 
                    onclick="addToCart('${product.id}')">
                    <div class="text-center">
                        <div class="bg-indigo-100 w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-2">
                            <span class="text-2xl">${product.emoji || '🍽️'}</span>
                        </div>
                        <h3 class="font-semibold text-gray-800 text-sm mb-1">${product.name}</h3>
                        <p class="text-indigo-600 font-bold">₱${product.price.toFixed(2)}</p>
                        <p class="text-xs text-gray-500 mt-1">Stock: ${product.quantity}</p>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                if (existingItem.quantity < product.quantity) {
                    existingItem.quantity++;
                } else {
                    alert('Not enough stock available');
                    return;
                }
            } else {
                cart.push({ ...product, quantity: 1, discount: 0 });
            }
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartDiv.innerHTML = '<p class="text-gray-500 text-center py-8">Cart is empty</p>';
            } else {
                cartDiv.innerHTML = cart.map((item, index) => `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800 text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-600">₱${item.price.toFixed(2)} each</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQuantity(${index}, -1)" 
                                class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 text-lg">-</button>
                            <span class="w-8 text-center font-semibold">${item.quantity}</span>
                            <button onclick="updateQuantity(${index}, 1)" 
                                class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 text-lg">+</button>
                            <button onclick="removeFromCart(${index})" 
                                class="ml-2 text-red-600 hover:text-red-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            calculateTotals();
        }

        function updateQuantity(index, change) {
            const item = cart[index];
            const product = products.find(p => p.id === item.id);
            
            const newQty = item.quantity + change;
            if (newQty <= 0) {
                removeFromCart(index);
            } else if (newQty <= product.quantity) {
                item.quantity = newQty;
                updateCart();
            } else {
                alert('Not enough stock available');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function calculateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            let discountValue = 0;
            const discountPercent = parseFloat(document.getElementById('discountInput').value) || 0;
            const discountAmount = parseFloat(document.getElementById('discountAmountInput').value) || 0;
            
            if (discountPercent > 0) {
                discountValue = subtotal * (discountPercent / 100);
            } else if (discountAmount > 0) {
                discountValue = discountAmount;
            }
            
            const total = Math.max(0, subtotal - discountValue);
            
            document.getElementById('subtotal').textContent = `₱${subtotal.toFixed(2)}`;
            document.getElementById('discountAmount').textContent = `-₱${discountValue.toFixed(2)}`;
            document.getElementById('total').textContent = `₱${total.toFixed(2)}`;
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', displayProducts);

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white');
                    b.classList.add('bg-gray-200', 'text-gray-700');
                });
                e.target.classList.add('bg-indigo-600', 'text-white');
                e.target.classList.remove('bg-gray-200', 'text-gray-700');
                currentCategory = e.target.dataset.category;
                displayProducts();
            });
        });

        document.getElementById('discountInput').addEventListener('input', () => {
            document.getElementById('discountAmountInput').value = '';
            calculateTotals();
        });

        document.getElementById('discountAmountInput').addEventListener('input', () => {
            document.getElementById('discountInput').value = '';
            calculateTotals();
        });

        document.getElementById('clearCartBtn').addEventListener('click', () => {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                updateCart();
            }
        });

        document.getElementById('paymentBtn').addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Cart is empty');
                return;
            }
            const total = parseFloat(document.getElementById('total').textContent.replace('₱', ''));
            document.getElementById('modalTotal').textContent = `₱${total.toFixed(2)}`;
            document.getElementById('paymentModal').classList.remove('hidden');
            document.getElementById('cashReceived').value = '';
            document.getElementById('change').textContent = '₱0.00';
        });

        document.getElementById('cashReceived').addEventListener('input', (e) => {
            const total = parseFloat(document.getElementById('modalTotal').textContent.replace('₱', ''));
            const cash = parseFloat(e.target.value) || 0;
            const change = Math.max(0, cash - total);
            document.getElementById('change').textContent = `₱${change.toFixed(2)}`;
        });

        document.getElementById('cancelPaymentBtn').addEventListener('click', () => {
            document.getElementById('paymentModal').classList.add('hidden');
        });

        document.getElementById('completePaymentBtn').addEventListener('click', async () => {
            const total = parseFloat(document.getElementById('modalTotal').textContent.replace('₱', ''));
            const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
            
            if (cash < total) {
                alert('Insufficient payment');
                return;
            }

            try {
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const discountValue = subtotal - total;

                // Save sale
                await db.collection('sales').add({
                    items: cart.map(item => ({
                        productId: item.id,
                        name: item.name,
                        price: item.price,
                        quantity: item.quantity
                    })),
                    subtotal,
                    discount: discountValue,
                    total,
                    cashReceived: cash,
                    change: cash - total,
                    cashier: currentUser.email,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Update inventory
                for (const item of cart) {
                    const productRef = db.collection('products').doc(item.id);
                    await productRef.update({
                        quantity: firebase.firestore.FieldValue.increment(-item.quantity)
                    });
                }

                alert('Sale completed successfully!');
                cart = [];
                updateCart();
                document.getElementById('paymentModal').classList.add('hidden');
                document.getElementById('discountInput').value = '';
                document.getElementById('discountAmountInput').value = '';
                await loadProducts();
            } catch (error) {
                console.error('Error completing sale:', error);
                alert('Error completing sale. Please try again.');
            }
        });
    </script>
</body>
</html>
