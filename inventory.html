<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-lg mb-4">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center text-indigo-600 hover:text-indigo-800">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Inventory Management</h1>
            <button id="addProductBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                + Add Product
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex flex-col sm:flex-row gap-4 mb-4">
                <input type="text" id="searchInput" placeholder="Search products..." 
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">All Categories</option>
                    <option value="food">Food</option>
                    <option value="drinks">Drinks</option>
                    <option value="desserts">Desserts</option>
                </select>
                <select id="stockFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">All Stock</option>
                    <option value="low">Low Stock</option>
                    <option value="out">Out of Stock</option>
                </select>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Product</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Category</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Price</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Stock</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
                            <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-4">Add Product</h2>
            
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                    <input type="text" id="productName" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="productCategory" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Select Category</option>
                        <option value="food">Food</option>
                        <option value="drinks">Drinks</option>
                        <option value="desserts">Desserts</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price (₱)</label>
                    <input type="number" id="productPrice" required min="0" step="0.01"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                    <input type="number" id="productQuantity" required min="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Minimum Stock Alert</label>
                    <input type="number" id="minQuantity" value="10" min="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Emoji (Optional)</label>
                    <input type="text" id="productEmoji" maxlength="2" placeholder="🍔"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description (Optional)</label>
                    <textarea id="productDescription" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
                        Save Product
                    </button>
                    <button type="button" id="cancelModalBtn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Adjust Stock Modal -->
    <div id="adjustStockModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Adjust Stock</h2>
            
            <div class="mb-4">
                <p class="text-sm text-gray-600">Product: <span id="adjustProductName" class="font-semibold text-gray-800"></span></p>
                <p class="text-sm text-gray-600">Current Stock: <span id="adjustCurrentStock" class="font-semibold text-gray-800"></span></p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Adjustment Type</label>
                <select id="adjustmentType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="add">Add Stock</option>
                    <option value="remove">Remove Stock</option>
                    <option value="set">Set Stock</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                <input type="number" id="adjustQuantity" min="0" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Reason (Optional)</label>
                <textarea id="adjustReason" rows="2"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div class="flex gap-3">
                <button id="saveAdjustmentBtn" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
                    Save Adjustment
                </button>
                <button id="cancelAdjustBtn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBR_PXkHxujRckgNXap4MqdH8MY98OQ_RI",
  authDomain: "pos-2-f566c.firebaseapp.com",
  projectId: "pos-2-f566c",
  storageBucket: "pos-2-f566c.firebasestorage.app",
  messagingSenderId: "1044464998936",
  appId: "1:1044464998936:web:ba368da8dc0d78ced8c16d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let products = [];
        let currentProductId = null;

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadProducts();
        });

        async function loadProducts() {
            try {
                const snapshot = await db.collection('products').orderBy('name').get();
                products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayProducts() {
            const table = document.getElementById('productsTable');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const stock = document.getElementById('stockFilter').value;

            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search);
                const matchesCategory = category === 'all' || p.category === category;
                let matchesStock = true;
                
                if (stock === 'low') matchesStock = p.quantity <= (p.minQuantity || 10) && p.quantity > 0;
                else if (stock === 'out') matchesStock = p.quantity === 0;
                
                return matchesSearch && matchesCategory && matchesStock;
            });

            table.innerHTML = filtered.map(p => {
                let statusClass = 'bg-green-100 text-green-800';
                let statusText = 'In Stock';
                
                if (p.quantity === 0) {
                    statusClass = 'bg-red-100 text-red-800';
                    statusText = 'Out of Stock';
                } else if (p.quantity <= (p.minQuantity || 10)) {
                    statusClass = 'bg-yellow-100 text-yellow-800';
                    statusText = 'Low Stock';
                }

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3">
                            <div class="flex items-center">
                                <span class="text-2xl mr-2">${p.emoji || '🍽️'}</span>
                                <div>
                                    <div class="font-semibold text-gray-800">${p.name}</div>
                                    ${p.description ? `<div class="text-xs text-gray-500">${p.description}</div>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-700 capitalize">${p.category}</td>
                        <td class="px-4 py-3 text-sm font-semibold text-gray-800">₱${p.price.toFixed(2)}</td>
                        <td class="px-4 py-3 text-sm font-semibold text-gray-800">${p.quantity}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="adjustStock('${p.id}')" class="text-blue-600 hover:text-blue-800 mr-3 text-sm font-medium">
                                Adjust
                            </button>
                            <button onclick="editProduct('${p.id}')" class="text-indigo-600 hover:text-indigo-800 mr-3 text-sm font-medium">
                                Edit
                            </button>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-600 hover:text-red-800 text-sm font-medium">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openProductModal(productId = null) {
            currentProductId = productId;
            const modal = document.getElementById('productModal');
            
            if (productId) {
                const product = products.find(p => p.id === productId);
                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('productId').value = productId;
                document.getElementById('productName').value = product.name;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productQuantity').value = product.quantity;
                document.getElementById('minQuantity').value = product.minQuantity || 10;
                document.getElementById('productEmoji').value = product.emoji || '';
                document.getElementById('productDescription').value = product.description || '';
            } else {
                document.getElementById('modalTitle').textContent = 'Add Product';
                document.getElementById('productForm').reset();
                document.getElementById('minQuantity').value = 10;
            }
            
            modal.classList.remove('hidden');
        }

        function adjustStock(productId) {
            const product = products.find(p => p.id === productId);
            currentProductId = productId;
            
            document.getElementById('adjustProductName').textContent = product.name;
            document.getElementById('adjustCurrentStock').textContent = product.quantity;
            document.getElementById('adjustQuantity').value = '';
            document.getElementById('adjustReason').value = '';
            document.getElementById('adjustmentType').value = 'add';
            
            document.getElementById('adjustStockModal').classList.remove('hidden');
        }

        async function editProduct(productId) {
            openProductModal(productId);
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await db.collection('products').doc(productId).delete();
                alert('Product deleted successfully');
                await loadProducts();
            } catch (error) {
                console.error('Error deleting product:', error);
                alert('Error deleting product');
            }
        }

        // Event Listeners
        document.getElementById('addProductBtn').addEventListener('click', () => openProductModal());
        
        document.getElementById('searchInput').addEventListener('input', displayProducts);
        document.getElementById('categoryFilter').addEventListener('change', displayProducts);
        document.getElementById('stockFilter').addEventListener('change', displayProducts);

        document.getElementById('cancelModalBtn').addEventListener('click', () => {
            document.getElementById('productModal').classList.add('hidden');
        });

        document.getElementById('cancelAdjustBtn').addEventListener('click', () => {
            document.getElementById('adjustStockModal').classList.add('hidden');
        });

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseInt(document.getElementById('productQuantity').value),
                minQuantity: parseInt(document.getElementById('minQuantity').value) || 10,
                emoji: document.getElementById('productEmoji').value || '',
                description: document.getElementById('productDescription').value || '',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (currentProductId) {
                    await db.collection('products').doc(currentProductId).update(productData);
                    alert('Product updated successfully');
                } else {
                    productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('products').add(productData);
                    alert('Product added successfully');
                }
                
                document.getElementById('productModal').classList.add('hidden');
                await loadProducts();
            } catch (error) {
                console.error('Error saving product:', error);
                alert('Error saving product');
            }
        });

        document.getElementById('saveAdjustmentBtn').addEventListener('click', async () => {
            const type = document.getElementById('adjustmentType').value;
            const quantity = parseInt(document.getElementById('adjustQuantity').value);
            const reason = document.getElementById('adjustReason').value;
            
            if (!quantity && type !== 'set') {
                alert('Please enter a quantity');
                return;
            }

            const product = products.find(p => p.id === currentProductId);
            let newQuantity = product.quantity;

            if (type === 'add') newQuantity += quantity;
            else if (type === 'remove') newQuantity = Math.max(0, newQuantity - quantity);
            else if (type === 'set') newQuantity = quantity;

            try {
                await db.collection('products').doc(currentProductId).update({
                    quantity: newQuantity,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Log adjustment
                await db.collection('inventory_adjustments').add({
                    productId: currentProductId,
                    productName: product.name,
                    type,
                    oldQuantity: product.quantity,
                    newQuantity,
                    quantity,
                    reason,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    user: auth.currentUser.email
                });

                alert('Stock adjusted successfully');
                document.getElementById('adjustStockModal').classList.add('hidden');
                await loadProducts();
            } catch (error) {
                console.error('Error adjusting stock:', error);
                alert('Error adjusting stock');
            }
        });
    </script>
</body>
</html>
